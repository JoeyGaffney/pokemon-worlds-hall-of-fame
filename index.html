<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Pokémon World Championships Database</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header class="site-header">

        <div class="container">

            <div class="site-title">
                <h1>
                    Pokémon World Championships Database
                </h1>

                <p>
                    Historical competitor and placement data from the
                    Pokémon World Championships.
                </p>
            </div>


            <section class="controls">

                <input
                    type="search"
                    id="search"
                    placeholder="Search competitor..."
                >

                <select id="yearFilter">
                    <option value="">All Years</option>
                </select>

                <select id="divisionFilter">
                    <option value="">All Divisions</option>
                    <option value="Juniors">Juniors</option>
                    <option value="Seniors">Seniors</option>
                    <option value="Masters">Masters</option>
                </select>

                <select id="countryFilter">
                    <option value="">All Countries</option>
                </select>

                <button
                    id="clearFilters"
                    class="clear-button"
                    type="button"
                >
                    Clear
                </button>

            </section>

        </div>

    </header>

    <main class="container">

    <section
        id="landing"
        class="landing"
    >

        <h2>Explore the World Championships</h2>

        <p>
            Search for a competitor or jump into one of these
            views.
        </p>


        <div class="suggestion-grid">

            <button
                class="suggestion-card"
                data-preset="champions"
            >
                <span class="suggestion-icon">🏆</span>

                <span>
                    <strong>World Champions</strong>
                    <small>Every first-place finisher</small>
                </span>
            </button>


            <button
                class="suggestion-card"
                data-preset="finalists"
            >
                <span class="suggestion-icon">🥈</span>

                <span>
                    <strong>World Finalists</strong>
                    <small>Players finishing 1st or 2nd</small>
                </span>
            </button>


            <button
                class="suggestion-card"
                data-preset="top8"
            >
                <span class="suggestion-icon">⭐</span>

                <span>
                    <strong>Top 8 Finishers</strong>
                    <small>Players reaching the Top 8</small>
                </span>
            </button>


            <button
                class="suggestion-card"
                data-year="2026"
            >
                <span class="suggestion-icon">📅</span>

                <span>
                    <strong>2026 Worlds</strong>
                    <small>Browse the latest results</small>
                </span>
            </button>


            <button
                class="suggestion-card"
                data-division="Masters"
            >
                <span class="suggestion-icon">🎴</span>

                <span>
                    <strong>Masters</strong>
                    <small>Browse Masters competitors</small>
                </span>
            </button>


            <button
                class="suggestion-card"
                data-preset="returning"
            >
                <span class="suggestion-icon">🔁</span>

                <span>
                    <strong>Returning Players</strong>
                    <small>Competitors with multiple Worlds appearances</small>
                </span>
            </button>

        </div>

    </section>


    <section
        id="resultsSection"
        class="results-section"
        hidden
    >

        <div class="results-heading">

            <h2>Results</h2>

            <p id="resultCount"></p>

        </div>


        <div class="table-wrapper">

            <table>

                <thead>
                    <tr>
                        <th>Player Name</th>
                        <th>Country</th>
                        <th>Divisions Competed</th>
                        <th>Years Competed</th>
                        <th>Best Finish</th>
                    </tr>
                </thead>

                <tbody id="results"></tbody>

            </table>

        </div>

    </section>

</main>

    <script src="app.js?v=2"></script>

</body>

</html>
